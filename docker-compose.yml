version: "3.9"

services:
  api:
    build: .
    container_name: api
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - prometheus
    networks:
      - driftguard-net
    environment:
      DB_HOST: ""
      DB_PORT: "5432"
      DB_USER: ""
      DB_PASSWORD: ""
      DB_NAME: ""
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AZURE_STORAGE_ACCOUNT: ""
      AZURE_STORAGE_KEY: ""

  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - driftguard-net

  worker:
    build: ./worker
    container_name: worker
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      AZURE_STORAGE_ACCOUNT: ""
      AZURE_STORAGE_KEY: ""
      DB_HOST: ""
      DB_PORT: "5432"
      DB_USER: ""
      DB_PASSWORD: ""
      DB_NAME: ""
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    networks:
      - driftguard-net

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - driftguard-net

  grafana:
    image: grafana/grafana:10.0.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - driftguard-net

volumes:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  driftguard-net:
    driver: bridge
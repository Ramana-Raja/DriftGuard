<!DOCTYPE html>
<html lang="en" class="dark"> <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriftGuard - Authentication</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Enable Tailwind class-based dark mode
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-white flex items-center justify-center min-h-screen font-sans transition-colors duration-200 relative">

<div class="absolute top-4 right-4">
    <button onclick="toggleTheme()" class="text-gray-500 hover:text-blue-500 dark:text-gray-400 dark:hover:text-blue-400 transition-colors p-2 rounded-full bg-gray-200 dark:bg-gray-800 shadow-sm" title="Toggle Theme">
        <i id="theme-icon" class="ph ph-sun text-xl"></i>
    </button>
</div>

<div class="w-full max-w-md bg-white dark:bg-gray-900 rounded-xl shadow-xl dark:shadow-2xl border border-gray-200 dark:border-gray-800 p-8 transition-colors duration-200">

    <div class="text-center mb-8">
        <div class="flex items-center justify-center gap-2 mb-2">
            <i class="ph-fill ph-shield-check text-emerald-500 dark:text-emerald-400 text-4xl"></i>
        </div>
        <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-500 to-emerald-500 dark:from-blue-400 dark:to-emerald-400 bg-clip-text text-transparent">DriftGuard</h1>
        <p class="text-gray-500 dark:text-gray-400 mt-2 text-sm" id="form-subtitle">Welcome back</p>
    </div>

    <div class="flex bg-gray-100 dark:bg-gray-800 p-1 rounded-lg mb-6 transition-colors">
        <button id="tab-login" onclick="toggleMode('login')" class="flex-1 py-2 rounded-md bg-white dark:bg-gray-700 font-medium text-gray-900 dark:text-white shadow-sm transition-all text-sm">Sign In</button>
        <button id="tab-signup" onclick="toggleMode('signup')" class="flex-1 py-2 rounded-md text-gray-500 dark:text-gray-400 font-medium hover:text-gray-900 dark:hover:text-white transition-all text-sm">Create Account</button>
    </div>

    <form id="auth-form" onsubmit="handleSubmit(event)" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Email Address</label>
            <input type="email" id="email" required placeholder="you@example.com" class="w-full bg-gray-50 dark:bg-gray-950 border border-gray-300 dark:border-gray-700 rounded-lg px-4 py-2.5 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-600 transition-colors">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Password</label>
            <input type="password" id="password" required placeholder="••••••••" class="w-full bg-gray-50 dark:bg-gray-950 border border-gray-300 dark:border-gray-700 rounded-lg px-4 py-2.5 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-600 transition-colors">
        </div>

        <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-lg mt-6 transition-colors shadow-lg shadow-blue-500/20 dark:shadow-blue-500/30">
            Sign In
        </button>
    </form>

    <div id="status-message" class="mt-4 text-sm text-center hidden"></div>
</div>

<script>
    // --- THEME MANAGEMENT ---
    const html = document.documentElement;
    const themeIcon = document.getElementById('theme-icon');

    // Check local storage on load to match user preference
    if (localStorage.getItem('theme') === 'light') {
        html.classList.remove('dark');
        themeIcon.className = 'ph ph-moon text-xl';
    } else {
        html.classList.add('dark');
        themeIcon.className = 'ph ph-sun text-xl';
    }

    function toggleTheme() {
        if (html.classList.contains('dark')) {
            html.classList.remove('dark');
            localStorage.setItem('theme', 'light');
            themeIcon.className = 'ph ph-moon text-xl';
        } else {
            html.classList.add('dark');
            localStorage.setItem('theme', 'dark');
            themeIcon.className = 'ph ph-sun text-xl';
        }
    }

    // --- AUTHENTICATION LOGIC ---
    let currentMode = 'login';

    function toggleMode(mode) {
        currentMode = mode;
        const tabLogin = document.getElementById('tab-login');
        const tabSignup = document.getElementById('tab-signup');
        const submitBtn = document.getElementById('submit-btn');
        const subtitle = document.getElementById('form-subtitle');

        if (mode === 'signup') {
            // UI Updates for Signup
            tabSignup.classList.add('bg-white', 'dark:bg-gray-700', 'text-gray-900', 'dark:text-white', 'shadow-sm');
            tabSignup.classList.remove('text-gray-500', 'dark:text-gray-400');
            tabLogin.classList.remove('bg-white', 'dark:bg-gray-700', 'text-gray-900', 'dark:text-white', 'shadow-sm');
            tabLogin.classList.add('text-gray-500', 'dark:text-gray-400');

            submitBtn.innerText = 'Create Account';
            subtitle.innerText = 'Start monitoring your ML models';
        } else {
            // UI Updates for Login
            tabLogin.classList.add('bg-white', 'dark:bg-gray-700', 'text-gray-900', 'dark:text-white', 'shadow-sm');
            tabLogin.classList.remove('text-gray-500', 'dark:text-gray-400');
            tabSignup.classList.remove('bg-white', 'dark:bg-gray-700', 'text-gray-900', 'dark:text-white', 'shadow-sm');
            tabSignup.classList.add('text-gray-500', 'dark:text-gray-400');

            submitBtn.innerText = 'Sign In';
            subtitle.innerText = 'Welcome back';
        }
    }

    async function handleSubmit(event) {
        event.preventDefault();

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const statusDiv = document.getElementById('status-message');

        const payload = { email: email, password: password };
        const endpoint = currentMode === 'signup' ? '/api/register' : '/api/login';

        try {
            // Show connecting status
            statusDiv.classList.remove('hidden', 'text-red-500', 'text-green-500', 'dark:text-red-400', 'dark:text-green-400');
            statusDiv.classList.add('text-gray-500', 'dark:text-gray-400');
            statusDiv.innerText = `Connecting...`;

            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (response.ok) {
                // SUCCESS!
                // 1. Save the token securely in Edge/Chrome/Firefox
                localStorage.setItem('driftguard_jwt', data.token);

                // Show brief success message
                statusDiv.classList.replace('text-gray-500', 'text-green-500');
                statusDiv.classList.replace('dark:text-gray-400', 'dark:text-green-400');
                statusDiv.innerText = `Success! Redirecting...`;

                // 2. Redirect to the Dashboard
                setTimeout(() => {
                    window.location.href = '/dashboard';
                }, 500); // 500ms delay just so the user sees the "Success" text

            } else {
                // SERVER RETURNED AN ERROR
                statusDiv.classList.replace('text-gray-500', 'text-red-500');
                statusDiv.classList.replace('dark:text-gray-400', 'dark:text-red-400');
                statusDiv.innerText = `Error: ${data.error || 'Authentication Failed'}`;
            }
        } catch (error) {
            // NETWORK ERROR (Go server is down)
            statusDiv.classList.replace('text-gray-500', 'text-red-500');
            statusDiv.classList.replace('dark:text-gray-400', 'dark:text-red-400');
            statusDiv.innerText = `Network error. Is your backend running?`;
        }
    }
</script>
</body>
</html>

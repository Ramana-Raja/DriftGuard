apiVersion: apps/v1
kind: Deployment
metadata:
  name: driftguard-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: driftguard-api
  template:
    metadata:
      labels:
        app: driftguard-api
    spec:
      containers:
        - name: api
          image: ""
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          env:
            - name: DB_HOST
              value: ""
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: ""
            - name: DB_PASSWORD
              value: ""
            - name: DB_NAME
              value: ""
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: AZURE_STORAGE_ACCOUNT
              value: ""
            - name: AZURE_STORAGE_KEY
              value: ""

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: driftguard-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: driftguard-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

---
apiVersion: v1
kind: Service
metadata:
  name: api-internal
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8080
  selector:
    app: driftguard-api

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: driftguard-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: driftguard-worker
  template:
    metadata:
      labels:
        app: driftguard-worker
    spec:
      containers:
        - name: worker
          image: ""
          env:
            - name: AZURE_STORAGE_ACCOUNT
              value: ""
            - name: AZURE_STORAGE_KEY
              value: ""
            - name: DB_HOST
              value: ""
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: ""
            - name: DB_PASSWORD
              value: ""
            - name: DB_NAME
              value: ""
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"